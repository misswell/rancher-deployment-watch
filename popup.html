<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rancher Deployment Watch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="icons/icon48.png" alt="" aria-hidden="true" />
        <div>
          <h1>Deployment Watch</h1>
          <p id="summary" aria-live="polite">正在读取监控项…</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="refresh" title="立即刷新" aria-label="立即刷新">
          <span class="refresh-icon">↻</span>
        </button>
        <button class="button primary" id="add">＋ 添加监控</button>
      </div>
    </header>

    <main>
      <section id="toolbar" class="toolbar hidden">
        <div class="toolbar-left">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="watch-search" type="search" autocomplete="off" placeholder="搜索 Cluster、命名空间或 Deployment" aria-label="搜索监控项" />
          </label>
          <div class="filters" aria-label="状态筛选">
            <button class="filter active" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter" data-filter="problem" aria-pressed="false">仅异常</button>
          </div>
          <div class="filters view-switch" aria-label="视图模式">
            <button class="filter view-mode active" data-view="standard" aria-pressed="true">标准</button>
            <button class="filter view-mode" data-view="compact" aria-pressed="false">全局</button>
          </div>
        </div>
        <label class="interval-label" title="弹窗打开时按所选间隔触发；上次刷新未完成时合并为下一次，Chrome 后台最短约 30 秒">
          自动刷新
          <select id="refresh-interval">
            <option value="5">5 秒</option>
            <option value="10">10 秒</option>
            <option value="15">15 秒</option>
            <option value="30">30 秒</option>
            <option value="60">1 分钟</option>
            <option value="300">5 分钟</option>
            <option value="600">10 分钟</option>
          </select>
        </label>
      </section>
      <section id="content"></section>
    </main>

    <dialog id="add-dialog">
      <form method="dialog" id="add-form">
        <div class="dialog-header">
          <div>
            <h2>添加 Deployment</h2>
            <p>可一次粘贴多个 Rancher Deployment 详情页地址</p>
          </div>
          <button type="button" class="icon-button close" id="close-dialog" aria-label="关闭">×</button>
        </div>

        <label class="field">
          <span>Deployment 地址（每行一个）</span>
          <textarea id="deployment-url" rows="5" required placeholder="https://rancher.example.com/dashboard/c/cluster-a/explorer/apps.deployment/test/api#pods&#10;https://rancher.example.com/dashboard/c/cluster-b/explorer/apps.deployment/prod/worker#pods"></textarea>
          <small id="url-hint">支持批量添加，也可从当前 Rancher 页面自动读取</small>
        </label>

        <button type="button" class="button secondary full" id="use-current">使用当前标签页</button>

        <div class="two-columns">
          <label class="field">
            <span>环境名称（可选，批量共用）</span>
            <input id="environment-label" placeholder="例如：生产环境" />
          </label>
          <label class="field">
            <span>显示名称（单条时可选）</span>
            <input id="watch-label" placeholder="例如：同步服务" />
          </label>
        </div>

        <div id="form-error" class="form-error hidden" role="alert"></div>
        <div class="dialog-actions">
          <button type="button" class="button ghost" id="cancel-dialog">取消</button>
          <button type="submit" class="button primary" id="save-watch">授权站点并添加</button>
        </div>
      </form>
    </dialog>

    <dialog id="name-dialog" class="compact-dialog" aria-labelledby="name-dialog-title" aria-describedby="name-dialog-context">
      <form method="dialog" id="name-form">
        <div class="dialog-header">
          <div>
            <h2 id="name-dialog-title">修改显示名称</h2>
            <p id="name-dialog-context"></p>
          </div>
          <button type="button" class="icon-button close" id="close-name-dialog" aria-label="关闭">×</button>
        </div>

        <label class="field">
          <span>显示名称</span>
          <input id="name-input" maxlength="40" autocomplete="off" placeholder="输入便于识别的名称" />
          <small id="name-dialog-hint">只修改扩展中的显示名称，不影响 Rancher 资源。</small>
        </label>

        <div id="name-dialog-error" class="form-error hidden" role="alert"></div>
        <div class="dialog-actions split-actions">
          <button type="button" class="button ghost" id="reset-display-name">恢复默认</button>
          <div>
            <button type="button" class="button ghost" id="cancel-name-dialog">取消</button>
            <button type="submit" class="button primary" id="save-display-name">保存名称</button>
          </div>
        </div>
      </form>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
