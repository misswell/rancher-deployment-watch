<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#17315c" flood-opacity=".18"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #17202a; }
      .muted { fill: #667085; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .medium { font-size: 16px; }
      .bold { font-weight: 700; }
      .card { fill: #fff; stroke: #e4e8ee; }
    </style>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1100" cy="112" r="210" fill="#d7e9ff" opacity=".65"/>
  <circle cx="120" cy="750" r="230" fill="#e2f5ec" opacity=".72"/>

  <text x="80" y="98" font-size="38" font-weight="750">多个 Cluster，一个全局视图</text>
  <text x="82" y="133" font-size="18" class="muted">集中查看指定 Deployment 与 Pod 状态，快速发现异常</text>
  <g transform="translate(1052 92)">
    <rect width="148" height="34" rx="17" fill="#fff" opacity=".9"/>
    <circle cx="18" cy="17" r="5" fill="#98a2b3"/>
    <text x="32" y="22" class="tiny muted">界面示例数据</text>
  </g>

  <g transform="translate(80 172)" filter="url(#shadow)">
    <rect width="1120" height="550" rx="18" fill="#f5f7fa"/>
    <rect width="1120" height="74" rx="18" fill="#fff"/>
    <rect y="56" width="1120" height="18" fill="#fff"/>
    <line x1="0" y1="74" x2="1120" y2="74" stroke="#e4e8ee"/>
    <image href="../icons/icon128.png" x="24" y="19" width="38" height="38"/>
    <text x="74" y="36" class="medium bold">Deployment Watch</text>
    <text x="74" y="55" class="tiny muted">8 个监控项 · 7 正常 · 1 异常</text>
    <g transform="translate(914 20)">
      <rect width="34" height="34" rx="8" fill="#fff" stroke="#e4e8ee"/>
      <text x="17" y="24" font-size="21" text-anchor="middle" class="muted">↻</text>
      <rect x="45" width="137" height="34" rx="8" fill="#1769e0"/>
      <text x="113" y="22" class="tiny bold" text-anchor="middle" fill="#fff">＋ 添加监控</text>
    </g>

    <g transform="translate(24 92)">
      <rect width="390" height="36" rx="9" fill="#fff" stroke="#e4e8ee"/>
      <text x="14" y="23" class="small muted">⌕</text>
      <text x="37" y="23" class="tiny muted">搜索 Cluster、命名空间或 Deployment</text>
      <g transform="translate(425 0)">
        <rect width="118" height="36" rx="9" fill="#fff" stroke="#e4e8ee"/>
        <rect x="4" y="4" width="53" height="28" rx="7" fill="#edf4ff"/>
        <text x="31" y="23" class="tiny bold" text-anchor="middle" fill="#1769e0">全部</text>
        <text x="87" y="23" class="tiny muted" text-anchor="middle">仅异常</text>
      </g>
      <g transform="translate(553 0)">
        <rect width="118" height="36" rx="9" fill="#fff" stroke="#e4e8ee"/>
        <text x="31" y="23" class="tiny muted" text-anchor="middle">标准</text>
        <rect x="61" y="4" width="53" height="28" rx="7" fill="#edf4ff"/>
