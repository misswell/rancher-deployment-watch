        <rect x="106" y="44" width="86" height="54" rx="7" fill="#f7f8fa"/>
        <text x="114" y="65" class="medium bold">0</text><text x="114" y="85" class="tiny muted">重启</text>
        <line x1="0" y1="111" x2="204" y2="111" stroke="#edf0f3"/>
        <text x="12" y="132" class="tiny" fill="#1769e0">打开 Rancher</text>
      </g>
